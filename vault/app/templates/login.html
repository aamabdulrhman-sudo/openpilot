<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreePilots Vault | تسجيل الدخول</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between antialiased">

    <!-- Top bar -->
    <header class="p-6 flex justify-between items-center max-w-5xl mx-auto w-full">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center text-white shadow-lg shadow-cyan-500/20">
                <i class="fa-solid fa-shield-halved text-lg"></i>
            </div>
            <span class="font-bold text-lg text-white">FreePilots Vault</span>
        </div>
        
        <button onclick="toggleLang()" id="langBtn" class="px-3 py-1.5 rounded-lg border border-slate-700 bg-slate-900 text-xs font-semibold text-cyan-400 hover:bg-slate-800 transition">
            English / عربي
        </button>
    </header>

    <!-- Main Card -->
    <main class="flex-1 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-8 max-w-md w-full shadow-2xl space-y-6">
            <div class="text-center space-y-2">
                <div class="w-16 h-16 rounded-2xl bg-cyan-500/10 text-cyan-400 border border-cyan-500/20 flex items-center justify-center mx-auto text-2xl">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <h2 id="loginTitle" class="text-2xl font-bold text-white">تسجيل الدخول إلى الخزنة</h2>
                <p id="loginSubtitle" class="text-xs text-slate-400">الرجاء إدخال بيانات حساب المدير للمتابعة</p>
            </div>

            {% if error %}
            <div class="bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs p-3 rounded-xl flex items-center gap-2">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form action="/login" method="POST" class="space-y-4">
                <div>
                    <label id="lblUsername" class="block text-xs font-medium text-slate-300 mb-1.5">اسم المستخدم (Username)</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 start-0 flex items-center ps-3.5 pointer-events-none text-slate-500 text-sm">
                            <i class="fa-solid fa-user"></i>
                        </span>
                        <input type="text" name="username" required placeholder="admin" class="w-full ps-10 pe-3 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm text-white focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500">
                    </div>
                </div>

                <div>
                    <label id="lblPassword" class="block text-xs font-medium text-slate-300 mb-1.5">كلمة المرور (Password)</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 start-0 flex items-center ps-3.5 pointer-events-none text-slate-500 text-sm">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input type="password" name="password" required placeholder="••••••••" class="w-full ps-10 pe-3 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm text-white focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500">
                    </div>
                </div>

                <button type="submit" id="btnSubmit" class="w-full py-3 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-bold rounded-xl text-sm transition-all shadow-lg shadow-cyan-500/20">
                    دخول (Login)
                </button>
            </form>
        </div>
    </main>

    <footer class="p-6 text-center text-xs text-slate-500">
        FreePilots Vault &bull; 100% Private Dashcam Server for Sunnypilot
    </footer>

    <script>
        let currentLang = 'ar';
        function toggleLang() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            applyLang();
        }
        function applyLang() {
            const html = document.documentElement;
            if (currentLang === 'ar') {
                html.dir = 'rtl';
                html.lang = 'ar';
                document.getElementById('loginTitle').innerText = 'تسجيل الدخول إلى الخزنة';
                document.getElementById('loginSubtitle').innerText = 'الرجاء إدخال بيانات حساب المدير للمتابعة';
                document.getElementById('lblUsername').innerText = 'اسم المستخدم (Username)';
                document.getElementById('lblPassword').innerText = 'كلمة المرور (Password)';
                document.getElementById('btnSubmit').innerText = 'دخول (Login)';
            } else {
                html.dir = 'ltr';
                html.lang = 'en';
                document.getElementById('loginTitle').innerText = 'Sign In to Vault';
                document.getElementById('loginSubtitle').innerText = 'Please enter administrator credentials to proceed';
                document.getElementById('lblUsername').innerText = 'Username';
                document.getElementById('lblPassword').innerText = 'Password';
                document.getElementById('btnSubmit').innerText = 'Sign In';
            }
        }
    </script>
</body>
</html>
